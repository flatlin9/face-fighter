<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#111111">
<meta name="format-detection" content="telephone=no">
<title>FACE FIGHTER</title>
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;height:100dvh;background:#111;overflow:hidden;overscroll-behavior:none;
    touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
    -webkit-text-size-adjust:100%;font-family:Impact,"Arial Black",sans-serif}
  body{position:fixed;inset:0}
  *{-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
  #safe{position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;pointer-events:none;
    padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
  #wrap{position:fixed;left:0;top:0;width:960px;height:540px}
  canvas{display:block;width:100%;height:100%;image-rendering:auto;background:#000;touch-action:none}
  #touch{position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none;display:none;z-index:10}
  #touch.on{display:block}
  .tb{position:absolute;pointer-events:auto;border-radius:50%;background:rgba(255,255,255,.16);border:3px solid rgba(255,255,255,.6);
      color:#fff;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1;text-shadow:0 2px 2px #000;
      box-sizing:border-box;touch-action:none;font-family:Impact,"Arial Black",sans-serif;letter-spacing:.5px}
  .tb.down{background:rgba(255,220,60,.6);transform:scale(.94)}
  .tb.punch{border-color:#ff7a7a}.tb.kick{border-color:#7ab8ff}.tb.block{border-color:#9dff7a}
  .tb.special{border-color:#ffd23f;background:rgba(255,210,63,.22)}.tb.super{border-color:#ff9df5;background:rgba(255,120,240,.22)}
  .tb.cool{opacity:.4}
  #rotate{position:fixed;inset:0;z-index:99990;background:#1a0b2e;color:#ffd23f;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-size:26px;padding:20px;box-sizing:border-box}
  #rotate.on{display:flex}
  #rotate .ph{width:60px;height:100px;border:5px solid #ffd23f;border-radius:12px;margin-bottom:24px;animation:rot 2s ease-in-out infinite}
  @keyframes rot{0%,20%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
  #pwlock{position:fixed;inset:0;z-index:99999;background:#1a0b2e;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:10px;font-family:Impact,Arial Black,sans-serif;color:#ffd23f;box-sizing:border-box;
    padding:max(8px,env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left))}
  #pwlock .pwl{display:flex;flex-direction:column;align-items:center}
  #pwtitle{font-size:min(48px,9vw,11vh);font-size:min(48px,9vw,11dvh);text-shadow:3px 3px #c0392b;margin-bottom:8px}
  #pwin{font-size:28px;padding:6px 12px;width:180px;text-align:center;border-radius:8px;border:3px solid #ffd23f;letter-spacing:8px;background:#fff;color:#000}
  #pwpad{display:grid;grid-template-columns:repeat(3,var(--k));gap:8px;--k:min(72px,18vw,13vh);--k:min(72px,18vw,13dvh)}
  #pwpad button{width:var(--k);height:var(--k);font-size:calc(var(--k)*.42);border-radius:14px;border:3px solid #ffd23f;background:#2d1650;color:#fff;
    font-family:Impact,Arial Black,sans-serif;touch-action:manipulation;padding:0}
  #pwpad button:active{background:#ffd23f;color:#2d1650}
  #pwpad button.ok{background:#ffd23f;color:#b0101a}
  #pwerr{color:#ff6b6b;margin-top:8px;height:24px;font-family:Arial,sans-serif;font-size:18px}
  @media (orientation:landscape){ #pwlock{flex-direction:row;gap:6vw} #pwpad{--k:min(72px,14vw,18vh);--k:min(72px,14vw,18dvh)} }
</style>
</head>

  <canvas id="c" width="960" height="540"></canvas>

function readViewport(){
  const vv = window.visualViewport;
  let w = vv ? vv.width : innerWidth, h = vv ? vv.height : innerHeight;
  if(!w || !h){ w = document.documentElement.clientWidth || innerWidth; h = document.documentElement.clientHeight || innerHeight; }
  return { w, h, x: vv ? vv.offsetLeft : 0, y: vv ? vv.offsetTop : 0 };
}
function readSafe(){
  if(SAFE_OVERRIDE) return SAFE_OVERRIDE;

}
function resize(){
  const v = readViewport(), s = readSafe();
  view.w = v.w; view.h = v.h; view.x = v.x; view.y = v.y; [view.st, view.sr, view.sb, view.sl] = s;
  view.portrait = v.h > v.w;
  const aw = Math.max(1, v.w - s[1] - s[3]), ah = Math.max(1, v.h - s[0] - s[2]);
  const sc = Math.min(aw / W, ah / H);
  const cw = Math.floor(W*sc), ch = Math.floor(H*sc);
  wrap.style.width = cw+"px"; wrap.style.height = ch+"px";
  wrap.style.left = Math.round(v.x + s[3] + (aw-cw)/2)+"px"; wrap.style.top = Math.round(v.y + s[0] + (ah-ch)/2)+"px";
  view.key = [innerWidth, innerHeight, v.w, v.h, s.join()].join("|");

let actx = null, muted = false;
function audio(){ if(!actx){ try{ actx = new (window.AudioContext||window.webkitAudioContext)();
    const s = actx.createBufferSource(); s.buffer = actx.createBuffer(1,1,22050); s.connect(actx.destination); s.start(0); }catch(e){} } if(actx && actx.state==="suspended") actx.resume(); if(actx && typeof Music!=="undefined" && !Music.running && !window.__noMusic) Music.start(); return actx; }
function tone(freq, dur, type="square", vol=0.15, slide=0){
  const a = actx; if(!a || muted) return;
  const o = a.createOscillator(), g = a.createGain(); o.type = type;
  o.frequency.setValueAtTime(freq, a.currentTime);
  if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(30,freq+slide), a.currentTime+dur);
  g.gain.setValueAtTime(vol, a.currentTime); g.gain.exponentialRampToValueAtTime(0.001, a.currentTime+dur);
  o.connect(g).connect(a.destination); o.start(); o.stop(a.currentTime+dur);
}
function noise(dur, vol=0.25){
  const a = actx; if(!a || muted) return;
  const b = a.createBuffer(1, a.sampleRate*dur, a.sampleRate), d = b.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i] = (Math.random()*2-1)*(1-i/d.length);
  const s = a.createBufferSource(), g = a.createGain(); s.buffer = b; g.gain.value = vol;
  s.connect(g).connect(a.destination); s.start();
}

  // ---------- the sequencer: everything that happens on one 16th step ----------

    else if(sec==="break" && s%2===0) lead(B,t,[64,67,71,76,74,71,67,71][(s/2)%8]+(b>=2?12:0),1.2,0.35+b*0.12);

  // ---------- realtime engine ----------
  function tick(){

const keys = {}, taps = {}; // taps: key went down since last read (so very quick taps are never missed)
const KEYMAP = [
  { left:["KeyA"], right:["KeyD"], up:["KeyW"], punch:["KeyF"], kick:["KeyG"], block:["KeyH"], special:["KeyT"], super:["KeyY"] },
  { left:["ArrowLeft"], right:["ArrowRight"], up:["ArrowUp"], punch:["KeyK"], kick:["KeyL"], block:["Semicolon"], special:["KeyJ"], super:["KeyI"] }

const ACTIONS = ["left","right","up","punch","kick","block","special","super"];

function clearTaps(){ for(const k in taps) delete taps[k]; for(const p of touchTaps) for(const k in p) delete p[k]; }
addEventListener("keydown", e=>{
  audio();
  if(["ArrowLeft","ArrowRight","ArrowUp","ArrowDown","Space"].includes(e.code)) e.preventDefault();
  if(!keys[e.code]){ onKeyPress(e.code); taps[e.code] = true; }

addEventListener("blur", ()=>{ for(const k in keys) keys[k]=false; releaseAllTouches(); });

function readInput(pi, mode){
  const m = KEYMAP[pi], o = {};
  for(const a in m){
    const ks = (pi===0 && mode==="cpu") ? m[a].concat(KEYMAP[1][a]) : m[a];
    o[a] = ks.some(k=>keys[k]||taps[k]) || !!touchState[pi][a] || !!touchTaps[pi][a];
  }

}

// ---------- on-screen thumb controls (multitouch, slide between buttons) ----------
const touchEl = document.getElementById("touch");
const PAD_DEFS = [ // per player: action buttons (move buttons are shared layout)
  [ ["punch","WRENCH"], ["kick","KICK"], ["block","BLOCK"], ["special","PLUNGER!"] ],                         // playing as Jay
  [ ["punch","PUNCH"], ["kick","KICK"], ["block","BLOCK"], ["special","BEER CAN"], ["super","SHOT-<br>GUN!"] ]   // playing as Ryan
];
let touchBtns = [];        // {el, p, k}
const ptrMap = new Map();  // pointerId -> button index
function buildPads(){
  touchEl.innerHTML = ""; touchBtns = []; ptrMap.clear();
  const who = window.__game ? __game.human : 0;   // touch input slot 0 always drives the human's fighter
  touchEl.dataset.who = who;
  for(const p of [0]){
    const defs = [["left","&#9664;"],["right","&#9654;"],["up","&#9650;"]].concat(PAD_DEFS[who]);
    for(const [k,label] of defs){
      const el = document.createElement("div"); el.className = "tb "+k; el.innerHTML = label;
      el.dataset.p = p; el.dataset.k = k; el.dataset.i = touchBtns.length;
      touchEl.appendChild(el); touchBtns.push({el, p, k});
    }
  }
  layoutTouch();
}
function layoutTouch(){
  // position buttons (CSS px) inside the safe rectangle of the visible viewport
  const L = view.x + view.sl, T = view.y + view.st, aw = view.w - view.sl - view.sr, ah = view.h - view.st - view.sb;
  touchEl.style.left = L+"px"; touchEl.style.top = T+"px"; touchEl.style.width = aw+"px"; touchEl.style.height = ah+"px";
  const S = Math.round(Math.max(44, Math.min(Math.min(ah*0.21, aw*0.105), 96)));
  const gap = Math.round(S*0.16), m = Math.round(Math.max(8, S*0.22));
  const place = (b,x,y)=>{ const st = b.el.style; st.width = st.height = S+"px"; st.left = Math.round(x)+"px"; st.top = Math.round(y)+"px";
    st.fontSize = Math.round(S*(b.k==="left"||b.k==="right"||b.k==="up" ? 0.36 : 0.19))+"px"; };
  const yb = ah - m - S, yt = yb - S - gap;            // bottom row / top row
  const byP = p => touchBtns.filter(b=>b.p===p);
  const placeMove = (bs,x0)=>{ for(const b of bs){ if(b.k==="left") place(b,x0,yb); if(b.k==="right") place(b,x0+S*1.3,yb); if(b.k==="up") place(b,x0+S*0.65,yt-S*0.05); } };
  const placeAct = (bs,x0)=>{ const acts = bs.filter(b=>!["left","right","up"].includes(b.k)); const cols = Math.ceil(acts.length/2);
    acts.forEach((b,i)=>{ const row = i<cols ? 0 : 1, col = row ? i-cols : i; place(b, x0 + col*(S+gap) + (row? S*0.45 : 0), row ? yt : yb); }); return cols; };

  const bs = byP(0), nAct = bs.length - 3; placeMove(bs, m); placeAct(bs, aw - m - actW(nAct));
}
function syncTouch(){
  const now = [{}, {}];
  for(const i of ptrMap.values()){ const b = touchBtns[i]; if(b) now[b.p][b.k] = true; }
  touchBtns.forEach(b=>{ const on = !!now[b.p][b.k]; if(on && !touchState[b.p][b.k]) touchTaps[b.p][b.k] = true; b.el.classList.toggle("down", on); });
  for(const p of [0,1]) for(const k of ACTIONS) touchState[p][k] = !!now[p][k];
}
function btnAt(x,y){ const el = document.elementFromPoint(x,y); return el && el.classList && el.classList.contains("tb") && el.parentNode===touchEl ? +el.dataset.i : -1; }
function releaseAllTouches(){ ptrMap.clear(); if(typeof syncTouch==="function") syncTouch(); }
touchEl.addEventListener("pointerdown", e=>{
  const el = e.target.closest ? e.target.closest(".tb") : null; if(!el) return;
  e.preventDefault(); audio();
  try{ el.releasePointerCapture(e.pointerId); }catch(_){}
  ptrMap.set(e.pointerId, +el.dataset.i); syncTouch();

addEventListener("pointermove", e=>{ if(!ptrMap.has(e.pointerId)) return; const i = btnAt(e.clientX, e.clientY);
  if(i>=0 && i!==ptrMap.get(e.pointerId)){ ptrMap.set(e.pointerId, i); syncTouch(); } }, {passive:true});
["pointerup","pointercancel"].forEach(ev=>addEventListener(ev, e=>{ if(ptrMap.delete(e.pointerId)) syncTouch(); }, true));

function canvasPoint(e){ const r = cv.getBoundingClientRect(); return { x:(e.clientX-r.left)*W/r.width, y:(e.clientY-r.top)*H/r.height }; }
// UI taps go to the canvas *and* the empty areas around it (letterbox bars), mapped into game coordinates
addEventListener("pointerdown", e=>{
  if(e.target.closest && (e.target.closest("#touch .tb") || e.target.closest("#pwlock") || e.target.closest("#rotate"))) return;
  audio(); const p = canvasPoint(e); onPointer(p.x, p.y);
});

// ===================== FACES =====================
const faces = [];
function loadFaces(cb){
  let n = 0;
  FACE_SRC.forEach((src,i)=>{
    const img = new Image();
    img.onload = ()=>{
      // sample skin tone at cheeks for swelling bumps
      const t = document.createElement("canvas"); t.width = img.width; t.height = img.height;
      const tc = t.getContext("2d"); tc.drawImage(img,0,0);
      const lm = LANDMARKS[i]; let r=0,g=0,b=0,c=0;
      for(const key of ["cheekL","cheekR","nose","fore"]){
        const d = tc.getImageData(Math.floor(lm[key][0]*img.width)-4, Math.floor(lm[key][1]*img.height)-4, 9, 9).data;
        for(let j=0;j<d.length;j+=4){ if(d[j+3]>200){ r+=d[j]; g+=d[j+1]; b+=d[j+2]; c++; } }
      }
      c = c||1;
      faces[i] = { img, lm, skin:[r/c|0, g/c|0, b/c|0] };
      if(++n===2) cb();
    };
    img.src = src;
  });
}

const SUPER_CD = 840, SUPER_HEAL = 12, BUFF_T = 360;
const HIT_WORDS = {
  base:["POW!","BAM!","WHAM!","BONK!","SMACK!","THWACK!","OOF!","KAPOW!"],
  jay:["CLOGGED!","DRAIN-O!","PIPE DOWN!","WRENCHED!","CLANK!","LEAK!","BONK!","POW!"],
  ryan:["CRACK!","PSSHH!","SUDS!","CHEERS!","FIZZ!","WHAM!","POW!"]
};
const HEAD_W = 104, HEAD_H = 156;      // big-head style
const FC_PAD_X = 40, FC_PAD_Y = 30;    // offscreen padding so swelling/band-aids can poke out
const COLORS = [
  { shirt:"#d8342c", shirt2:"#a01f1a", pants:"#2d5cb0", glove:"#f2c230", shoe:"#6b3a1e", belt:"#6b3d1f", denim:"#2f63c0", denim2:"#1f4590" }, // Jay: plumber
  { shirt:"#b0279e", shirt2:"#7a1a6d", pants:"#2a1a1a", glove:"#2fa8e8", shoe:"#222",    belt:"#3fffb0" }
];

class Fighter{
  constructor(i){
    this.i = i; this.name = NAMES[i]; this.col = COLORS[i];
    this.fc = document.createElement("canvas");
    this.fc.width = 200 + FC_PAD_X*2; this.fc.height = 300 + FC_PAD_Y*2;
    this.fctx = this.fc.getContext("2d");
    this.wins = 0; this.reset();
  }
  reset(){
    this.x = this.i===0 ? 300 : 660; this.y = GROUND; this.vx = 0; this.vy = 0;
    this.facing = this.i===0 ? 1 : -1;
    this.hp = 100; this.dispHp = 100; this.state = "idle"; this.t = 0; this.stateT = 0;
    this.atk = null; this.atkHit = false; this.stun = 0; this.hitFlash = 0; this.hitDir = 1;
    this.koT = 0; this.blocking = false; this.walkT = 0; this.prevIn = {};
    this.cdSpecial = 0; this.cdSuper = 0; this.buff = 0; this.stuckT = 0; this.healFx = 0;
  }
  get onGround(){ return this.y >= GROUND; }
  get level(){ const h = this.hp; return h<=0?5 : h<=20?4 : h<=40?3 : h<=60?2 : h<=80?1 : 0; }

  update(inp, opp, game){
    this.t++; this.stateT++;
    const pressed = a => inp[a] && !this.prevIn[a];
    if(this.hitFlash>0) this.hitFlash = Math.max(0, this.hitFlash-0.06);
    if(this.cdSpecial>0) this.cdSpecial--; if(this.cdSuper>0) this.cdSuper--; if(this.buff>0) this.buff--;
    if(this.stuckT>0) this.stuckT--; if(this.healFx>0) this.healFx--;
    this.dispHp += (this.hp - this.dispHp) * 0.06;

    const canAct = game.phase==="fight";
    if(this.state==="ko"){ this.koT++; this.vx *= 0.9; }
    else if(this.state==="win"){ this.vx = 0; }
    else if(this.state==="hit"){
      this.stun--; this.vx *= 0.86;
      if(this.stun<=0) this.setState("idle");
    } else if(this.state==="attack"){
      const a = ATTACKS[this.atk]; const total = a.startup+a.active+a.recover;
      if(this.onGround) this.vx *= 0.7;
      // punch+kick chord that lands a few frames apart: cancel the first hit into the special
      if(this.stateT<=4 && !this.atkHit && (this.atk==="punch"||this.atk==="wrench"||this.atk==="kick") && this.cdSpecial<=0 &&
         ((pressed("kick") && inp.punch) || (pressed("punch") && inp.kick))){ this.startAttack("special"); this.prevIn = Object.assign({}, inp); return; }
      if(a.throw){ if(this.stateT===a.startup+1) this.throwProjectile(game); }
      else if(a.chug){
        if(this.stateT===8) SFX.pssh();
        if(this.stateT>=16 && this.stateT<=46 && this.stateT%10===6) SFX.gulp();
        if(this.stateT===50){ const before = this.hp; this.hp = Math.min(100, this.hp + SUPER_HEAL); this.buff = BUFF_T; this.healFx = 60;
          SFX.burp(); game.popup("BURRP!", this.x, this.y-330, "#fff6c2", 46);
          game.popup("+"+(this.hp-before)+" HP", this.x, this.y-280, "#8dff8d", 26);
          for(let i=0;i<14;i++) game.foam(this.x + this.facing*10, this.y-200, 1); }
      }
      else if(this.stateT>a.startup && this.stateT<=a.startup+a.active && !this.atkHit) this.tryHit(opp, game);
      if(this.stateT>=total) this.setState("idle");
    } else {
      // free states: idle / walk / jump / block
      if(this.onGround && this.facingOK!==false){ this.facing = opp.x > this.x ? 1 : -1; }
      this.blocking = false;
      if(canAct){
        const combo = (pressed("punch") && inp.kick) || (pressed("kick") && inp.punch);
        if((pressed("special") || combo) && this.cdSpecial<=0) { this.startAttack("special"); }
        else if(pressed("super") && this.i===1 && this.cdSuper<=0 && this.onGround) { this.startAttack("super"); }
        else if(combo) { /* special on cooldown: swallow the combo */ }
        else if(pressed("punch")) { this.startAttack(this.i===0 ? "wrench" : "punch"); }
        else if(pressed("kick")) { this.startAttack("kick"); }
        else if(this.onGround && inp.block){ this.vx = 0; this.blocking = true; this.setState("block"); }
        else {
          let dir = (inp.right?1:0) - (inp.left?1:0);
          if(this.onGround){
            const back = dir!==0 && dir!==this.facing;
            this.vx = dir * (back ? 3.4 : 4.4);
            if(inp.up){ this.vy = -17.5; this.y = GROUND-1; this.setState("jump"); SFX.whoosh(); }
            else this.setState(dir ? "walk" : "idle");
          } else {
            this.vx += dir*0.25; this.vx = Math.max(-5.2, Math.min(5.2, this.vx));
          }
        }
      } else if(this.onGround && this.state!=="jump") { this.vx = 0; this.setState("idle"); }
    }
    if(this.state==="walk") this.walkT += 0.22 * Math.sign(this.vx*this.facing||1);

    // physics
    this.x += this.vx; this.vy += 0.9; this.y += this.vy;
    if(this.y >= GROUND){
      this.y = GROUND; this.vy = 0;
      if(this.state==="jump") this.setState("idle");
    }
    this.x = Math.max(50, Math.min(W-50, this.x));
    if(this.state==="ko"){ const hx = this.x - this.facing*275; // keep the knocked-out head on screen
      if(hx < 70) this.x += 70-hx; if(hx > W-70) this.x -= hx-(W-70); }
    this.prevIn = Object.assign({}, inp);
  }
  setState(s){ if(this.state!==s){ this.state = s; this.stateT = 0; } }
  startAttack(kind){ this.atk = kind; this.atkHit = false; this.state = "attack"; this.stateT = 0;
    if(kind==="special") this.cdSpecial = PROJ[this.i===0?"plunger":"can"].cd;
    if(kind==="super"){ this.cdSuper = SUPER_CD; this.vx = 0; game.popup("SHOTGUN!", this.x, this.y-330, "#9fd8ff", 40); }
    else SFX.whoosh(); }
  throwProjectile(game){
    const kind = this.i===0 ? "plunger" : "can", P = PROJ[kind];
    game.projectiles.push({ kind, owner:this, dir:this.facing, x:this.x + this.facing*60, y:this.y + (kind==="plunger" ? -205 : -190),
      vx:this.facing*P.speed, vy:P.vy, g:P.g, rot:0, spin: kind==="can" ? 0.35*this.facing : 0, life:120 });
    if(kind==="plunger"){ SFX.plunger(); game.popup("PLUNGER!", this.x + this.facing*40, this.y-320, "#ffd23f", 34); }
    else { SFX.canThrow(); game.popup("MILLER TIME!", this.x + this.facing*40, this.y-320, "#9fd8ff", 30); }
  }
  tryHit(opp, game){
    const a = ATTACKS[this.atk];
    if(opp.state==="ko") return;
    const dx = (opp.x - this.x) * this.facing;
    const dy = Math.abs(opp.y - this.y);
    if(dx > a.reach[0]-30 && dx < a.reach[1]+26 && dy < 130){
      this.atkHit = true;
      const blocked = opp.state==="block" && opp.facing === -this.facing;
      opp.takeHit(this, a, blocked, game);
    }
  }
  takeHit(att, a, blocked, game, proj){
    const dir = proj ? proj.dir : att.facing;
    const hx = this.x - dir*24, hy = this.y + (!proj && att.y < this.y-40 ? -230 : a.h) ;
    const dmg = Math.round(a.dmg * (att.buff>0 ? 1.3 : 1));
    if(blocked){
      this.hp = Math.max(1, this.hp - Math.ceil(dmg*0.15));
      this.vx = dir * a.kb * 0.6;
      game.sparks(hx, hy, "#9fd8ff", 8); game.popup("BLOCK", hx, hy-30, "#bfe6ff", 26);
      game.shake = Math.max(game.shake, 3); SFX.block();
      return;
    }
    this.hp = Math.max(0, this.hp - dmg);
    this.hitFlash = 1; this.hitDir = dir;
    this.vx = dir * a.kb; if(!this.onGround) this.vy = -6;
    this.stun = a.stun; this.state = "hit"; this.stateT = 0; this.atk = null;
    const heavy = a===ATTACKS.kick || !!proj;
    game.sparks(hx, hy, "#fff36b", heavy?22:14);
    let word;
    if(proj && proj.kind==="plunger"){ word = ["CLOGGED!","PLUNGED!","SHLOOP!"][(Math.random()*3)|0]; this.stuckT = 75; SFX.plop(); }
    else if(proj && proj.kind==="can"){ word = Math.random()<0.5 ? "CRACK!" : "PSSHH!"; SFX.crack(); }
    else { const words = Math.random()<0.6 ? HIT_WORDS[att.i===0?"jay":"ryan"] : HIT_WORDS.base; word = words[(Math.random()*words.length)|0]; }
    game.popup(word, hx, hy-40, null, heavy?50:42);
    if(att.i===0) game.splash(hx, hy, proj ? 16 : 9);       // plumber hits: water splash
    else game.foam(hx, hy, proj ? 22 : 10);                 // beer hits: foam
    game.shake = Math.max(game.shake, heavy?12:7);
    game.hitstop = heavy?6:4;
    if(!proj) (a===ATTACKS.kick?SFX.big:SFX.hit)(); else SFX.hit();
    if(this.hp<=0){ this.state = "ko"; this.koT = 0; this.vx = dir*7; this.vy = -9; game.onKO(this, att); }
  }

  // ---------- drawing ----------
  pose(){
    // joints in local space (x forward), origin at feet center
    const s = this.state, t = this.t, P = {};
    const bob = Math.sin(t*0.12)*2.5;
    P.hip = [0,-72+bob*0.3]; P.sh = [4,-142+bob]; P.lean = 0;
    P.fFoot=[24,0]; P.bFoot=[-24,0]; P.fKnee=[22,-36]; P.bKnee=[-14,-38];
    P.fGlove=[40,-124+bob]; P.fElb=[26,-104+bob]; P.bGlove=[24,-134+bob]; P.bElb=[6,-110+bob];
    if(s==="walk"){
      const w = Math.sin(this.walkT);
      P.fFoot=[24+w*16, -Math.max(0,Math.cos(this.walkT))*8]; P.bFoot=[-24-w*16, -Math.max(0,-Math.cos(this.walkT))*8];
      P.fKnee=[18+w*12,-38]; P.bKnee=[-16-w*12,-38];
    }
    if(s==="jump" || (!this.onGround && s!=="hit" && s!=="ko")){
      P.fFoot=[18,-22]; P.bFoot=[-18,-14]; P.fKnee=[30,-46]; P.bKnee=[-2,-44];
    }
    if(s==="block"){
      P.fGlove=[34,-158]; P.fElb=[28,-118]; P.bGlove=[24,-146]; P.bElb=[14,-112]; P.lean=-4;
      P.fKnee=[20,-32]; P.hip=[0,-68]; P.sh=[2,-138];
    }
    if(s==="attack"){
      const a = ATTACKS[this.atk], st = this.stateT;
      let p = st<=a.startup ? st/a.startup : st<=a.startup+a.active ? 1 : 1-(st-a.startup-a.active)/a.recover;
      p = Math.max(0,Math.min(1,p));
      if(this.atk==="punch"){
        P.fGlove=[40+70*p,-130]; P.fElb=[26+42*p,-128+8*(1-p)]; P.lean=8*p; P.sh=[4+10*p,-142];
        P.bGlove=[20-6*p,-132]; P.bElb=[0,-112];
      } else if(this.atk==="wrench"){   // overhead pipe-wrench swing
        P.fGlove=[8+62*p,-206+76*p]; P.fElb=[2+40*p,-172+42*p]; P.lean=-6+16*p; P.sh=[4+8*p,-142];
        P.bGlove=[20,-130]; P.bElb=[0,-110];
        P.wrenchAng = -2.15 + 2.35*p;
      } else if(this.atk==="special"){  // wind up behind the head, then throw
        P.fGlove=[-26+92*p,-198+40*p]; P.fElb=[-14+56*p,-160+22*p]; P.lean=-8+18*p; P.sh=[4+6*p,-142];
        P.bGlove=[34-20*p,-140]; P.bElb=[16,-114];
        P.holding = st<=a.startup;
      } else if(this.atk==="super"){    // SHOTGUN! can to the mouth, head back
        const k = Math.min(1, st/10), done = st>58 ? Math.min(1,(st-58)/12) : 0;
        const kk = k*(1-done); P.fGlove=[34-4*kk,-132-68*kk]; P.fElb=[44+4*kk,-128-24*kk]; P.lean=-9*kk;
        P.bGlove=[30,-120]; P.bElb=[12,-104]; P.chug = st<62; P.chugK = k*(1-done);
      } else {
        P.fFoot=[24+100*p, -100*p]; P.fKnee=[22+50*p, -36-60*p+10*p]; P.lean=-12*p;
        P.sh=[4-12*p,-140]; P.bFoot=[-24,0]; P.bKnee=[-14,-38];
        P.fGlove=[30-10*p,-130]; P.bGlove=[-10-20*p,-118]; P.bElb=[-6-10*p,-104];
      }
    }
    if(s==="hit"){
      const k = Math.min(1, this.stun/10);
      P.lean = -16*k; P.sh=[-10*k,-138]; P.fGlove=[10,-170*k-110*(1-k)]; P.fElb=[16,-130]; P.bGlove=[-34,-150*k-100*(1-k)]; P.bElb=[-20,-120];
    }
    if(s==="win"){
      const j = Math.abs(Math.sin(t*0.15))*10;
      P.fGlove=[66,-196-j]; P.fElb=[44,-160-j/2]; P.bGlove=[-58,-198-j]; P.bElb=[-38,-162-j/2];
    }
    if(s==="ko"){ P.fGlove=[30,-90]; P.bGlove=[-30,-92]; P.fElb=[22,-112]; P.bElb=[-22,-112]; }
    return P;
  }
  draw(c, time){
    const P = this.pose(), C = this.col, f = this.facing;
    // shadow
    const air = Math.max(0, GROUND - this.y);
    c.fillStyle = "rgba(0,0,0,0.35)";
    c.beginPath(); c.ellipse(this.x, GROUND+4, Math.max(20, 56-air*0.15), 10, 0, 0, Math.PI*2); c.fill();

    c.save();
    c.translate(this.x, this.y);
    let rot = 0;
    if(this.state==="ko"){ rot = -f * Math.min(1, this.koT/22) * Math.PI/2 * 0.96; c.translate(0, -Math.min(1,this.koT/22)*22); }
    if(this.buff>0 && this.state!=="ko"){ // MILLER TIME buff: frothy golden aura
      c.save(); c.globalAlpha = 0.25 + 0.12*Math.sin(time*0.3); c.fillStyle="#ffe48a";
      c.beginPath(); c.ellipse(0,-150,78,170,0,0,Math.PI*2); c.fill(); c.restore(); }
    c.rotate(rot);
    c.save(); c.scale(f,1);
    const limb = (a,b,cc,w,col)=>{ c.strokeStyle=col; c.lineWidth=w; c.lineCap="round"; c.lineJoin="round";
      c.beginPath(); c.moveTo(a[0],a[1]); c.lineTo(b[0],b[1]); c.lineTo(cc[0],cc[1]); c.stroke(); };
    const outline = (a,b,cc,w,col)=>{ limb(a,b,cc,w+5,"#111"); limb(a,b,cc,w,col); };
    // back arm + back leg
    outline(P.sh,[P.bElb[0],P.bElb[1]],P.bGlove,13,C.shirt2);
    outline(P.hip,P.bKnee,P.bFoot,20,C.pants);
    this.shoe(c,P.bFoot,C.shoe);
    // front leg
    outline(P.hip,P.fKnee,P.fFoot,21,C.pants);
    this.shoe(c,P.fFoot,C.shoe);
    // torso
    c.save(); c.translate(P.hip[0],P.hip[1]); c.rotate(P.lean*Math.PI/180);
    const tw=58, th=P.hip[1]-P.sh[1]+10;
    c.fillStyle="#111"; this.rrect(c,-tw/2-3,-th-3,tw+6,th+10,18); c.fill();
    const g = c.createLinearGradient(-tw/2,0,tw/2,0); g.addColorStop(0,C.shirt2); g.addColorStop(0.5,C.shirt); g.addColorStop(1,C.shirt2);
    c.fillStyle=g; this.rrect(c,-tw/2,-th,tw,th+4,16); c.fill();
    if(this.i===0) this.drawOveralls(c, tw, th);
    else { c.fillStyle=C.belt; c.fillRect(-tw/2,-6,tw,9);
      c.fillStyle="rgba(255,255,255,.18)"; c.beginPath(); c.ellipse(-8,-th+22,9,14,0.3,0,Math.PI*2); c.fill(); }
    c.restore();
    // front arm
    outline(P.sh,P.fElb,P.fGlove,14,C.shirt);
    this.glove(c,P.bGlove,C.glove,13);
    if(this.i===0 && this.state!=="ko"){   // Jay always carries the pipe wrench
      const ang = P.wrenchAng!=null ? P.wrenchAng : (this.state==="block" ? -1.35 : this.state==="hit" ? -2.4 : this.state==="win" ? -1.6 : -0.55);
      if(!P.holding) drawWrench(c, P.fGlove[0], P.fGlove[1], ang, 1.3);
    }
    if(P.holding) { if(this.i===0) drawPlunger(c, P.fGlove[0], P.fGlove[1]-4, -2.4, 0.9); else drawCan(c, P.fGlove[0], P.fGlove[1]-6, -0.3, 0.9); }
    if(!P.chug) this.glove(c,P.fGlove,C.glove,15);
    c.restore(); // un-mirror
    // head (not mirrored so the photo reads correctly)
    const neckX = f*(P.sh[0] + P.lean*1.2), neckY = P.sh[1] + 6;
    this.drawHead(c, neckX, neckY, time);
    if(P.chug){ // can + hand drawn in front of the face: bottom up, top at the mouth
      c.save(); c.scale(f,1);
      const k = P.chugK, gx = P.fGlove[0], gy = P.fGlove[1];
      const th = -0.2 - 2.37*k;
      this.glove(c,P.fGlove,C.glove,15);
      drawCan(c, gx + Math.sin(th)*12, gy - Math.cos(th)*12, th, 1.2);
      if(k>0.9 && this.stateT%6<3){ c.fillStyle="#fffbe8"; c.beginPath(); c.arc(gx-24, gy+34, 4, 0, Math.PI*2); c.fill(); } // drips
      c.restore();
    }
    c.restore();
  }
  drawOveralls(c, tw, th){
    const C = this.col;
    // denim bib + straps over the shirt
    const bw = tw*0.66, top = -th*0.62;
    c.fillStyle="#111"; this.rrect(c,-bw/2-2,top-2,bw+4,-top+8,8); c.fill();
    const g = c.createLinearGradient(-bw/2,0,bw/2,0); g.addColorStop(0,C.denim2); g.addColorStop(0.5,C.denim); g.addColorStop(1,C.denim2);
    c.fillStyle=g; this.rrect(c,-bw/2,top,bw,-top+4,7); c.fill();
    c.strokeStyle="#111"; c.lineWidth=9; c.lineCap="round";
    c.beginPath(); c.moveTo(-bw/2+5,top+3); c.lineTo(-tw/2+8,-th+4); c.moveTo(bw/2-5,top+3); c.lineTo(tw/2-8,-th+4); c.stroke();
    c.strokeStyle=C.denim; c.lineWidth=6;
    c.beginPath(); c.moveTo(-bw/2+5,top+3); c.lineTo(-tw/2+8,-th+4); c.moveTo(bw/2-5,top+3); c.lineTo(tw/2-8,-th+4); c.stroke();
    // stitching + bib pocket
    c.strokeStyle="rgba(255,210,90,.75)"; c.lineWidth=1.3; c.setLineDash([3,3]);
    this.rrect(c,-bw/2+3,top+3,bw-6,-top-4,5); c.stroke();
    c.strokeRect(-9,top+12,18,13); c.setLineDash([]);
    c.fillStyle="#cfd8e6"; c.fillRect(-2,top+6,3,10); // pencil in pocket
    // brass buttons
    for(const sx of [-1,1]){ c.fillStyle="#111"; c.beginPath(); c.arc(sx*(bw/2-6),top+6,5.5,0,Math.PI*2); c.fill();
      c.fillStyle="#ffcf3f"; c.beginPath(); c.arc(sx*(bw/2-6),top+6,4,0,Math.PI*2); c.fill(); }
    // tool belt with pouches and a screwdriver
    c.fillStyle="#111"; c.fillRect(-tw/2-3,-9,tw+6,14);
    c.fillStyle=C.belt; c.fillRect(-tw/2-1,-7,tw+2,10);
    c.fillStyle="#c9c9c9"; c.fillRect(-6,-7,12,10); c.fillStyle=C.belt; c.fillRect(-3,-4,6,4); // buckle
    for(const sx of [-1,1]){ const px = sx*(tw/2-4);
      c.fillStyle="#111"; this.rrect(c,px-10,-4,20,22,4); c.fill(); c.fillStyle="#8a5229"; this.rrect(c,px-8,-2,16,18,3); c.fill(); }
    c.fillStyle="#e8c020"; c.fillRect(tw/2-8,-16,5,13); c.fillStyle="#bbb"; c.fillRect(tw/2-7,-22,3,7);           // screwdriver
    c.fillStyle="#999"; c.fillRect(-tw/2,-14,4,11); c.fillStyle="#555"; c.fillRect(-tw/2-3,-17,10,4);              // hammer
  }
  shoe(c,p,col){ c.fillStyle="#111"; c.beginPath(); c.ellipse(p[0]+6,p[1]-2,17,9,0,0,Math.PI*2); c.fill();
    c.fillStyle=col; c.beginPath(); c.ellipse(p[0]+6,p[1]-3,14,6.5,0,0,Math.PI*2); c.fill(); }
  glove(c,p,col,r){ c.fillStyle="#111"; c.beginPath(); c.arc(p[0],p[1],r+3,0,Math.PI*2); c.fill();
    c.fillStyle=col; c.beginPath(); c.arc(p[0],p[1],r,0,Math.PI*2); c.fill();
    c.fillStyle="rgba(255,255,255,.45)"; c.beginPath(); c.arc(p[0]-r*0.35,p[1]-r*0.35,r*0.35,0,Math.PI*2); c.fill(); }
  rrect(c,x,y,w,h,r){ c.beginPath(); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath(); }

  renderFace(time){
    const fc = this.fctx, F = faces[this.i], lm = F.lm, L = this.level;
    const ox = FC_PAD_X, oy = FC_PAD_Y, fw = 200, fh = 300;
    const P = k => [ox + lm[k][0]*fw, oy + lm[k][1]*fh];
    fc.setTransform(1,0,0,1,0,0);
    fc.clearRect(0,0,this.fc.width,this.fc.height);
    fc.drawImage(F.img, ox, oy, fw, fh);
    // ---- clipped overlays (only paint on the face) ----
    fc.globalCompositeOperation = "source-atop";
    const blob = (x,y,rx,ry,stops,rot=0)=>{
      fc.save(); fc.translate(x,y); fc.rotate(rot); fc.scale(1, ry/rx);
      const g = fc.createRadialGradient(0,0,0,0,0,rx); stops.forEach(s=>g.addColorStop(s[0],s[1]));
      fc.fillStyle=g; fc.beginPath(); fc.arc(0,0,rx,0,Math.PI*2); fc.fill(); fc.restore();
    };
    const bruise = (x,y,r,rot=0)=> blob(x,y,r,r*0.75,[[0,"rgba(80,20,110,0.55)"],[0.45,"rgba(60,50,170,0.42)"],[0.75,"rgba(170,170,40,0.30)"],[1,"rgba(170,170,40,0)"]],rot);
    const blackEye = (k,str)=>{ const [x,y]=P(k);
      blob(x,y+2,34,24,[[0,`rgba(60,0,70,${0.25*str})`],[0.4,`rgba(45,0,60,${0.75*str})`],[0.75,`rgba(70,20,110,${0.5*str})`],[1,"rgba(70,20,110,0)"]]); };
    const redness = (k,a,r)=>{ const [x,y]=P(k); blob(x,y,r,r*0.8,[[0,`rgba(255,40,50,${a})`],[1,"rgba(255,40,50,0)"]]); };
    if(L>=1){ redness("cheekL",0.28,34); redness("cheekR",0.28,34); const [x,y]=P("fore"); bruise(x+22,y+4,22,0.4); }
    if(L>=2){ blackEye("eyeL",1); }
    if(L>=3){ const [x,y]=P("cheekL"); bruise(x+6,y+6,30,-0.3); redness("cheekR",0.35,40); const [mx,my]=P("chin"); bruise(mx-20,my-6,18,0.2); }
    if(L>=4){ blackEye("eyeR",1); redness("nose",0.55,22); redness("cheekL",0.3,40); }
    // hit flash red tint
    if(this.hitFlash>0){ fc.fillStyle=`rgba(255,30,30,${0.55*this.hitFlash})`; fc.fillRect(0,0,this.fc.width,this.fc.height); }
    if(this.state==="ko" || L>=5){ fc.fillStyle="rgba(120,120,255,0.12)"; fc.fillRect(0,0,this.fc.width,this.fc.height); }
    fc.globalCompositeOperation = "source-over";
    // swelling: a puffy cartoon cheek bulging past the face edge
    if(L>=3){
      const [cx,cy] = P("cheekR"); const sk = F.skin; const grow = L>=4?1.2:1;
      const bx = cx+16, r = 30*grow, cl = v=>Math.max(0,Math.min(255,v|0));
      const g = fc.createRadialGradient(bx-8,cy-10,3,bx,cy,r);
      g.addColorStop(0,`rgb(${cl(sk[0]+35)},${cl(sk[1]+28)},${cl(sk[2]+22)})`);
      g.addColorStop(0.65,`rgb(${cl(sk[0]+15)},${cl(sk[1]+2)},${cl(sk[2]-2)})`);
      g.addColorStop(1,`rgba(${cl(sk[0]-5)},${cl(sk[1]-30)},${cl(sk[2]-30)},0.9)`);
      fc.fillStyle=g; fc.beginPath(); fc.ellipse(bx,cy,r*0.8,r,0,0,Math.PI*2); fc.fill();
      fc.strokeStyle="rgba(90,20,30,.45)"; fc.lineWidth=2.5; fc.beginPath(); fc.ellipse(bx,cy,r*0.8,r,0,-1.3,1.4); fc.stroke();
      fc.fillStyle="rgba(255,255,255,.55)"; fc.beginPath(); fc.ellipse(bx-9,cy-12,7,4,-0.6,0,Math.PI*2); fc.fill();
    }
    // ---- stickers on top ----
    const bandaid = (x,y,len,rot,scr)=>{
      fc.save(); fc.translate(x,y); fc.rotate(rot);
      fc.fillStyle="rgba(0,0,0,.25)"; this.rrect(fc,-len/2+2,-11+3,len,22,11); fc.fill();
      fc.fillStyle="#f2c38f"; this.rrect(fc,-len/2,-11,len,22,11); fc.fill();
      fc.strokeStyle="#c9915a"; fc.lineWidth=1.5; fc.stroke();
      fc.fillStyle="#fbe3c4"; fc.fillRect(-len*0.17,-9,len*0.34,18);
      fc.fillStyle="#c9915a";
      for(const sx of [-1,1]) for(let i=0;i<3;i++) for(let j=0;j<2;j++){ fc.beginPath(); fc.arc(sx*(len*0.3+i*5), -4+j*8, 1.2,0,Math.PI*2); fc.fill(); }
      if(scr){ fc.strokeStyle="rgba(220,90,110,.8)"; fc.lineWidth=2; fc.beginPath(); fc.moveTo(len*0.24+6,-4); fc.lineTo(len*0.5+6,6); fc.stroke(); }
      fc.restore();
    };
    if(L>=2){ const [x,y]=P("fore"); bandaid(x+22,y+2,62,-0.5); bandaid(x+22,y+2,62,0.5); }
    if(L>=4){ const [x,y]=P("cheekL"); bandaid(x+2,y+4,54,0.5,true);
      // cartoon scratch marks on the other cheek
      const [rx,ry]=P("cheekR"); fc.strokeStyle="rgba(200,60,80,.85)"; fc.lineWidth=2.4; fc.lineCap="round";
      for(let i=0;i<3;i++){ fc.beginPath(); fc.moveTo(rx-22+i*7,ry-26); fc.lineTo(rx-30+i*7,ry-12); fc.stroke(); } }
    if(this.state==="ko"){ // swirly cartoon eyes
      for(const k of ["eyeL","eyeR"]){ const [x,y]=P(k);
        fc.fillStyle="rgba(255,255,255,.9)"; fc.beginPath(); fc.arc(x,y,16,0,Math.PI*2); fc.fill();
        fc.strokeStyle="#222"; fc.lineWidth=2.5; fc.beginPath();
        for(let a=0;a<Math.PI*6;a+=0.2){ const r=a*0.8, aa=a+time*0.25; const px=x+Math.cos(aa)*r, py=y+Math.sin(aa)*r; a?fc.lineTo(px,py):fc.moveTo(px,py); }
        fc.stroke(); }
    }
  }
  drawHead(c, nx, ny, time){
    this.renderFace(time);
    const fl = this.hitFlash;
    const sx = 1 + 0.2*fl, sy = 1 - 0.16*fl;
    const jig = fl>0 ? Math.sin(this.t*2.3)*5*fl : 0;
    const bob = (this.state==="idle"||this.state==="block") ? Math.sin(this.t*0.12)*2 : 0;
    const wFull = HEAD_W * this.fc.width/200, hFull = HEAD_H * this.fc.height/300;
    c.save();
    c.translate(nx + jig + this.hitDir*fl*8, ny - 4 + bob);
    c.rotate((this.state==="hit"? -this.hitDir*-0.15*Math.min(1,this.stun/10) : 0) + (this.level>=4 && this.state!=="ko" ? Math.sin(this.t*0.08)*0.06 : 0));
    c.scale(sx, sy);
    // neck
    c.fillStyle="#111"; c.fillRect(-11,-20,22,24);
    c.fillStyle=`rgb(${faces[this.i].skin.join(",")})`; c.fillRect(-8,-22,16,24);
    // head outline
    c.fillStyle="rgba(0,0,0,.85)"; c.beginPath(); c.ellipse(0,-HEAD_H/2+4,HEAD_W/2+3,HEAD_H/2+3,0,0,Math.PI*2); c.fill();
    c.drawImage(this.fc, -wFull/2, -HEAD_H - (FC_PAD_Y*HEAD_H/300) + 4, wFull, hFull);
    if(this.i===0) drawHardHat(c, this.state==="ko" ? 0.5 : 0);
    if(this.stuckT>0){ // plunger stuck to the face, wobbling, stick pointing back toward the thrower
      const wob = Math.sin(this.t*0.6)*0.18*Math.min(1,this.stuckT/30);
      drawPlunger(c, 0, -HEAD_H*0.42, (this.hitDir>0 ? Math.PI : 0) + wob, 1.05, true);
    }
    c.restore();
    // dizzy stars / birds orbiting near KO
    if(this.level>=4){
      const cx = nx, cy = ny - HEAD_H - 4, n = this.state==="ko"?6:4, items=[];
      for(let k=0;k<n;k++){ const a = time*0.07 + k*Math.PI*2/n; items.push({a, x:cx+Math.cos(a)*62, y:cy+Math.sin(a)*13, bird:k%2===1}); }
      items.sort((p,q)=>Math.sin(p.a)-Math.sin(q.a));
      for(const it of items){ const sc = 0.8+0.25*Math.sin(it.a);
        if(it.bird) drawBird(c,it.x,it.y,sc,time); else drawStar(c,it.x,it.y,10*sc,"#ffe14a"); }
    }
  }
}

function drawWrench(c,x,y,ang,s){

  c.fillStyle="#111"; c.fillRect(-6,-7,74,14);

  c.fillStyle="#c0392b"; c.fillRect(-4,-5,30,10);                         // red grip
  c.fillStyle=g; c.fillRect(24,-4,40,8);
  // jaw head
  c.fillStyle="#111"; c.beginPath(); c.moveTo(56,-8); c.lineTo(84,-14); c.lineTo(86,-2); c.lineTo(74,0); c.lineTo(86,4); c.lineTo(84,14); c.lineTo(56,10); c.closePath(); c.fill();
  c.fillStyle=g; c.beginPath(); c.moveTo(59,-5); c.lineTo(81,-10); c.lineTo(82,-4); c.lineTo(70,0); c.lineTo(82,3); c.lineTo(81,10); c.lineTo(59,7); c.closePath(); c.fill();

  c.fillStyle="#111"; c.beginPath(); c.ellipse(4,0,20,28,0,-Math.PI/2,Math.PI/2); c.lineTo(-6,26); c.lineTo(-6,-26); c.closePath(); c.fill();
  c.fillStyle="#d22a2a"; c.beginPath(); c.ellipse(3,0,16,24,0,-Math.PI/2,Math.PI/2); c.lineTo(-4,22); c.lineTo(-4,-22); c.closePath(); c.fill();
  c.fillStyle="#8e1414"; c.fillRect(-6,-26,6,52);

function drawHardHat(c, tilt){
  const top = -HEAD_H + 2;
  c.save(); c.rotate(tilt||0);
  c.fillStyle="#111"; c.beginPath(); c.ellipse(0,top+26,HEAD_W/2+16,9,0,0,Math.PI*2); c.fill();
  c.beginPath(); c.ellipse(0,top+24,HEAD_W/2-2,36,0,Math.PI,0); c.fill();
  const g = c.createLinearGradient(-HEAD_W/2,0,HEAD_W/2,0); g.addColorStop(0,"#d99b00"); g.addColorStop(0.45,"#ffd43a"); g.addColorStop(1,"#c98a00");
  c.fillStyle=g; c.beginPath(); c.ellipse(0,top+23,HEAD_W/2-5,33,0,Math.PI,0); c.fill();
  c.beginPath(); c.ellipse(0,top+25,HEAD_W/2+12,6,0,0,Math.PI*2); c.fill();
  c.fillStyle="#e0a800"; c.fillRect(-7,top-9,14,32);                       // center ridge
  c.fillStyle="rgba(255,255,255,.45)"; c.beginPath(); c.ellipse(-18,top+2,9,5,-0.4,0,Math.PI*2); c.fill();

function drawStar(c,x,y,r,col){
  c.save(); c.translate(x,y); c.beginPath();
  for(let i=0;i<10;i++){ const rr = i%2?r*0.45:r, a = i*Math.PI/5 - Math.PI/2; c.lineTo(Math.cos(a)*rr, Math.sin(a)*rr); }
  c.closePath(); c.fillStyle=col; c.fill(); c.strokeStyle="#7a5a00"; c.lineWidth=1.5; c.stroke(); c.restore();
}
function drawBird(c,x,y,s,time){
  c.save(); c.translate(x,y); c.scale(s,s);
  c.fillStyle="#5ab8ff"; c.strokeStyle="#123"; c.lineWidth=1.5;
  c.beginPath(); c.ellipse(0,0,9,7,0,0,Math.PI*2); c.fill(); c.stroke();
  const fl = Math.sin(time*0.5)*5;
  c.beginPath(); c.moveTo(-2,-2); c.quadraticCurveTo(-8,-10-fl,-14,-4); c.quadraticCurveTo(-8,-4,-2,-2); c.fill(); c.stroke();
  c.fillStyle="#ffb020"; c.beginPath(); c.moveTo(8,-1); c.lineTo(14,1); c.lineTo(8,3); c.fill();
  c.fillStyle="#000"; c.beginPath(); c.arc(4,-2,1.4,0,Math.PI*2); c.fill();
  c.restore();
}

// ===================== CPU AI =====================
class CPU{
  constructor(level="normal"){ this.think = 0; this.out = {}; this.hold = 0;
    this.cfg = { easy:{react:22,agg:0.35,block:0.15}, normal:{react:13,agg:0.6,block:0.35}, hard:{react:7,agg:0.8,block:0.6} }[level] || null;
    if(!this.cfg) this.cfg = { react:13, agg:0.6, block:0.35 }; }
  update(me, opp, game){
    const o = { left:false, right:false, up:false, punch:false, kick:false, block:false, special:false, super:false };
    if(game.phase!=="fight" || DEMO==="damage" || DEMO==="ko"){ this.out = o; return o; }
    const dx = opp.x - me.x, dist = Math.abs(dx), dir = Math.sign(dx)||1;
    // react to incoming attacks
    if(opp.state==="attack" && dist<150 && opp.stateT<4 && Math.random()<this.cfg.block*0.35){ this.mode="block"; this.hold=18; }
    if(--this.think<=0 && this.hold<=0){
      this.think = this.cfg.react + (Math.random()*10|0);
      const r = Math.random();
      // character powers: Ryan chugs (SHOTGUN!) when hurt and safe-ish, both throw their special from range
      if(me.i===1 && me.cdSuper<=0 && me.onGround && me.hp<80 && (dist>210 || me.hp<35) && opp.state!=="attack" && r<0.6){ this.mode="super"; this.hold=4; }
      else if(me.cdSpecial<=0 && dist>190 && dist<720 && Math.abs(opp.y-me.y)<60 && r<0.45){ this.mode="special"; this.hold=4; }
      else if(dist>150){ this.mode = r<0.08 ? "jumpin" : "approach"; this.hold = 14; }
      else if(dist>128){ this.mode = r<this.cfg.agg*0.5 ? "kick" : r<0.75 ? "approach" : r<0.88 ? "retreat" : "jumpin"; this.hold = 10; }
      else { this.mode = r<this.cfg.agg*0.6 ? "punch" : r<this.cfg.agg ? "kick" : r<this.cfg.agg+0.15 ? "block" : "retreat"; this.hold = this.mode==="block"?20:10; }
    }
    this.hold--;
    switch(this.mode){
      case "approach": if(dist>118){ o[dir>0?"right":"left"]=true; } break;
      case "retreat": o[dir>0?"left":"right"]=true; break;
      case "jumpin": o[dir>0?"right":"left"]=true; o.up=true; this.mode="airattack"; break;
      case "airattack": o[dir>0?"right":"left"]=true; if(!me.onGround && dist<120){ o.kick=true; this.mode="idle"; } if(me.onGround && me.stateT>2) this.mode="idle"; break;
      case "punch": o.punch = true; this.mode="idle"; break;
      case "kick": o.kick = true; this.mode="idle"; break;
      case "special": o.special = true; this.mode="idle"; break;
      case "super": o.super = true; this.mode="idle"; break;
      case "block": o.block = true; if(this.hold<=0) this.mode="idle"; break;
    }
    // release attack buttons alternately so edge detection works
    if((o.punch && this.out.punch) || (o.kick && this.out.kick)){ o.punch=o.kick=false; }
    if(o.special && this.out.special) o.special=false; if(o.super && this.out.super) o.super=false;
    this.out = o; return o;
  }
}

const ROUND_TIME = 60;
function loadPick(){ try{ const v = localStorage.getItem("ff_pick"); return v==="1" ? 1 : 0; }catch(e){ return 0; } }
function savePick(i){ try{ localStorage.setItem("ff_pick", String(i)); }catch(e){} }
const game = {
  scene:"title", mode:"cpu", human:loadPick(), selSel:loadPick(), previews:null, phase:"intro", round:1, timer:ROUND_TIME, frame:0, time:0,
  shake:0, hitstop:0, slow:0, particles:[], popups:[], banner:null, bannerT:0, endT:0, paused:false,
  fighters:[], cpu:null, msg:"", projectiles:[],
  splash(x,y,n){ for(let i=0;i<n;i++){ const a=-Math.PI*Math.random(), s=2+Math.random()*6;
      this.particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2,life:22+Math.random()*14,col:Math.random()<0.5?"#6fc8ff":"#c8ecff",drop:true,r:3+Math.random()*3}); } },
  foam(x,y,n){ for(let i=0;i<n;i++){ const a=Math.random()*Math.PI*2, s=1+Math.random()*5;
      this.particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2.5,life:26+Math.random()*16,col:Math.random()<0.35?"#ffe9a8":"#fffdf2",foam:true,r:4+Math.random()*5}); } },
  sparks(x,y,col,n){ for(let i=0;i<n;i++){ const a=Math.random()*Math.PI*2, s=2+Math.random()*7;
      this.particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:18+Math.random()*12,col,ray:Math.random()<0.5}); }
    this.particles.push({x,y,vx:0,vy:0,life:8,col:"#fff",ring:true,r:6}); },
  popup(txt,x,y,col,size){ this.popups.push({txt,x,y,col,size,life:42,rot:(Math.random()-0.5)*0.5}); },
  startMatch(pick){
    if(pick===0 || pick===1){ this.human = pick; this.selSel = pick; savePick(pick); }
    // 1 player vs CPU; the human plays this.human (0 = Jay on the left, 1 = Ryan on the right), the CPU the other
    const mode = "cpu"; this.mode = mode;
    this.scene = "game"; this.round = 1;
    this.fighters = [new Fighter(0), new Fighter(1)];
    this.cpu = mode==="cpu" ? new CPU(params.get("cpu")||"normal") : null;
    showPads(true);
    this.startRound();
  },
  startRound(){
    this.fighters.forEach(f=>f.reset()); game.hitstop=0; this.timer = ROUND_TIME; this.frame = 0;
    this.particles=[]; this.popups=[]; this.projectiles=[]; this.phase = "intro"; this.bannerT = 0; this.slow = 0;
    this.banner = (this.round===3 || (this.fighters[0].wins===1&&this.fighters[1].wins===1)) ? "FINAL ROUND" : "ROUND "+this.round;
    SFX.bell();
  },
  onKO(loser, winner){
    if(this.phase!=="fight") return;
    this.phase = "ko"; this.endT = 0; this.slow = 70; this.banner = "K.O.!"; this.bannerT = 0;
    winner.wins++; this.roundWinner = winner; SFX.ko();
  },
  timeUp(){
    this.phase = "ko"; this.endT = 0; this.bannerT = 0; this.banner = "TIME!";
    const [a,b] = this.fighters;
    if(a.hp===b.hp){ a.wins++; b.wins++; this.roundWinner = null; }
    else { const w = a.hp>b.hp?a:b; w.wins++; this.roundWinner = w; }
  },
  endRoundOrMatch(){
    const [a,b] = this.fighters;
    if(a.wins>=2 || b.wins>=2){
      this.scene = "over"; this.endT = 0;
      this.matchWinner = a.wins>=2 && b.wins>=2 ? null : a.wins>=2 ? a : b;
      if(this.matchWinner){ this.matchWinner.state="win"; }
      showPads(false);
    } else { this.round++; this.startRound(); }
  }
};

function onKeyPress(code){
  if(code==="KeyM"){ muted = !muted; return; }
  if(code==="KeyN"){ Music.toggle(); return; }
  if(code==="KeyF" && game.scene!=="game") { tryFullscreen(); }
  if(game.scene==="title"){
    if(code==="Enter"||code==="Space") toSelect();
  } else if(game.scene==="select"){
    if(["ArrowLeft","KeyA","ArrowRight","KeyD"].includes(code)){ game.selSel = 1-game.selSel; SFX.select(); }
    if(code==="Digit1") game.startMatch(0);
    if(code==="Digit2") game.startMatch(1);
    if(code==="Enter"||code==="Space") game.startMatch(game.selSel);
    if(code==="Escape") toTitle();
  } else if(game.scene==="over"){
    if(code==="Enter"||code==="Space"||code==="KeyR") game.startMatch();
    if(code==="Escape") toSelect();
  } else if(game.scene==="game"){
    if(code==="KeyP"||code==="Escape") game.paused = !game.paused;
    if(game.paused && code==="KeyQ"){ game.paused=false; toSelect(); }
    if(game.paused) releaseAllTouches();
  }
}
function toTitle(){ game.scene="title"; game.paused=false; showPads(false); }
function toSelect(){ game.scene="select"; game.paused=false; game.selSel = game.human; game.selT = 0; showPads(false); }

const PAUSE_UI = { resume:{x:W/2-150,y:268,w:300,h:58}, quit:{x:W/2-150,y:340,w:300,h:58} };
function onPointer(x,y){
  if(view.portrait) return;
  if(game.scene==="title"){
    if(soundBtns(x,y)) return;
    SFX.select(); toSelect();   // tap anywhere on the title (except SOUND/MUSIC) -> character select
  } else if(game.scene==="select"){
    if(soundBtns(x,y)) return;
    if(game.selT < 12) return;  // ignore the tail of the tap that opened this screen
    SEL_BOX.forEach((b,i)=>{ if(inBox(b,x,y)){ game.selSel = i; game.startMatch(i); } });
  } else if(game.scene==="over" && game.endT>40){
    if(y>390 && y<450 && x>250 && x<470) game.startMatch();
    else if(y>390 && y<450 && x>490 && x<710) toSelect();
  } else if(game.scene==="game"){
    if(!game.paused && x>W/2-50 && x<W/2+50 && y<132){ game.paused = true; releaseAllTouches(); return; } // tap timer / II to pause
    if(game.paused){ if(soundBtns(x,y)) return; if(inBox(PAUSE_UI.quit,x,y)) toSelect(); else game.paused=false; }
  }
}

function update(){
  if(window.__freeze) return; // test hook
  game.time++;
  if(game.scene==="title") return;
  if(game.scene==="select"){ game.selT = (game.selT||0)+1; if(game.previews) game.previews.forEach((f,i)=>{ f.t++; f.state = i===game.selSel ? "win" : "idle"; }); return; }
  if(game.scene==="over"){
    game.endT++;
    game.fighters.forEach((f,i)=>{ f.t++; if(f.state==="ko") f.koT++; f.dispHp += (f.hp-f.dispHp)*0.06; });
    stepFx(); return;
  }
  if(game.paused) return;
  if(game.hitstop>0){ game.hitstop--; return; }
  if(game.slow>0){ game.slow--; if(game.slow%3) { return; } }
  const [a,b] = game.fighters;
  game.bannerT++;
  if(game.phase==="intro"){
    if(game.bannerT===70){ game.banner="FIGHT!"; SFX.select(); }
    if(game.bannerT>=110){ game.phase="fight"; game.banner=null; }
  } else if(game.phase==="fight"){
    game.frame++;
    if(game.frame%60===0){ game.timer--; if(game.timer<=0){ game.timer=0; game.timeUp(); } }
  } else if(game.phase==="ko"){
    game.endT++;
    if(game.endT===80 && game.roundWinner && game.roundWinner.state!=="ko") game.roundWinner.state="win";
    if(game.endT>=190) { game.endRoundOrMatch(); return; }
  }
  const hu = game.human, me = game.fighters[hu], cpuF = game.fighters[1-hu];
  const inMe = readInput(0, game.mode), inCpu = game.cpu.update(cpuF, me, game);
  const in0 = hu===0 ? inMe : inCpu, in1 = hu===0 ? inCpu : inMe;
  a.update(in0, b, game); b.update(in1, a, game);
  clearTaps();
  stepProjectiles();
  // push apart
  const dx = b.x - a.x, minD = 112;
  if(Math.abs(dx) < minD && Math.abs(a.y-b.y) < 120 && a.state!=="ko" && b.state!=="ko"){
    const push = (minD - Math.abs(dx))/2 * (Math.sign(dx)||1);
    a.x -= push; b.x += push;
    a.x = Math.max(50,Math.min(W-50,a.x)); b.x = Math.max(50,Math.min(W-50,b.x));
  }
  stepFx();
}
function stepProjectiles(){
  game.projectiles = game.projectiles.filter(p=>{
    p.x += p.vx; p.vy += p.g; p.y += p.vy; p.rot += p.spin; p.life--;
    if(p.dead){ return p.life>0 && p.y < GROUND+40; }                  // bounced-off debris
    const opp = game.fighters[1-p.owner.i];
    if(opp.state!=="ko" && Math.abs(p.x-opp.x) < 46 && p.y > opp.y-305 && p.y < opp.y-10){
      const blocked = opp.state==="block" && opp.facing === -p.dir;
      const P = PROJ[p.kind];
      opp.takeHit(p.owner, P, blocked, game, p);
      if(p.kind==="can" || blocked){ p.dead = true; p.vx = -p.vx*0.35; p.vy = -7; p.g = 0.6; p.spin = -p.spin*1.5 || 0.4; p.life = 60; return true; }
      return false;                                                     // plunger sticks to the face (drawn on the head)
    }
    if(p.y >= GROUND-8 && p.g){ p.y = GROUND-8; p.vy *= -0.4; p.vx *= 0.6; if(Math.abs(p.vy)<1.5) p.dead = true; p.life = Math.min(p.life,40); }
    return p.life>0 && p.x>-80 && p.x<W+80;
  });
}
function drawProjectiles(c){
  for(const p of game.projectiles){
    c.globalAlpha = p.dead ? Math.min(1,p.life/20) : 1;
    if(p.kind==="plunger") drawPlunger(c, p.x, p.y, p.dir>0 ? Math.PI : 0, 0.9);
    else drawCan(c, p.x, p.y, p.rot, 1.05);
    c.globalAlpha = 1;
  }
}
function stepFx(){
  game.particles = game.particles.filter(p=>{ p.x+=p.vx; p.y+=p.vy; p.vy+= p.foam?0.12:0.25; p.vx*=0.95; if(p.ring) p.r+=6; if(p.foam) p.r+=0.15; return --p.life>0; });
  game.popups = game.popups.filter(p=>{ p.y-=0.8; return --p.life>0; });
  game.shake *= 0.86; if(game.shake<0.3) game.shake=0;
}

  c.drawImage(bgCanvas,-10,-10,W+20,H+20);
  const [a,b] = game.fighters;
  // draw KO'd/hit fighter behind
  const order = (b.state==="ko"||b.state==="hit") ? [b,a] : [a,b];
  order.forEach(f=>f.draw(c, game.time));
  if(game.scene==="game"){ const me = game.fighters[game.human]; if(me.state!=="ko"){ // "YOU" marker above the player's head
    const mx = me.x, my = me.y - 330 + Math.sin(game.time*0.12)*4, al = game.phase==="intro" ? 1 : 0.75;
    c.globalAlpha = al; c.fillStyle="#3fd16b"; c.strokeStyle="#000"; c.lineWidth=3;
    c.beginPath(); c.moveTo(mx-12,my); c.lineTo(mx+12,my); c.lineTo(mx,my+14); c.closePath(); c.fill(); c.stroke();
    txt(c,"YOU",mx,my-12,game.phase==="intro"?24:16,"#3fd16b","#000"); c.globalAlpha = 1; } }
  drawProjectiles(c);
  drawFx(c);
  c.setTransform(DPR,0,0,DPR,0,0);
  drawHUD(c);
  if(game.scene==="game" && game.banner){
    const t = game.bannerT, sc = game.banner==="K.O.!" ? Math.min(1.4, 0.3+t*0.06) : Math.min(1,0.3+ (t%70)*0.08);
    c.save(); c.translate(W/2,H/2-40); c.scale(sc,sc);
    const big = game.banner==="K.O.!" ? 150 : 84;
    txt(c,game.banner,0,0,big, game.banner==="K.O.!"?"#ff3b2f":"#ffeb3b","#000",undefined,big/8);
    c.restore();
    if(game.phase==="ko" && game.endT>60){
      const w = game.roundWinner; txt(c, w ? w.name.toUpperCase()+" WINS THE ROUND" : "DRAW", W/2, H/2+50, 34, "#fff");
    }
  }
  if(game.paused){
    c.fillStyle="rgba(0,0,0,.6)"; c.fillRect(0,0,W,H);
    txt(c,"PAUSED",W/2,H/2-80,80,"#ffeb3b");
    [["resume","RESUME","#ffd23f","#b0101a"],["quit","QUIT TO MENU","rgba(0,0,0,.7)","#fff"]].forEach(([k,s,bg,fg])=>{ const b = PAUSE_UI[k];
      c.fillStyle=bg; c.strokeStyle="#fff"; c.lineWidth=3; c.beginPath(); c.roundRect ? c.roundRect(b.x,b.y,b.w,b.h,12) : c.rect(b.x,b.y,b.w,b.h); c.fill(); c.stroke();
      txt(c,s,W/2,b.y+b.h/2+1,30,fg,k==="resume"?"#fff":"#000"); });
    txt(c,"tap anywhere to resume  ·  keyboard: P/Esc resume, Q quit",W/2,430,16,"#ddd");
    drawSoundBtns(c);
  }
  if(game.scene==="over"){
    const t = game.endT, al = Math.min(0.55, t/60);
    c.fillStyle=`rgba(0,0,0,${al})`; c.fillRect(0,0,W,H);
    const w = game.matchWinner;
    const sc = Math.min(1, 0.2+t*0.05);
    c.save(); c.translate(W/2,190); c.scale(sc,sc);
    txt(c, w ? w.name.toUpperCase()+" WINS!" : "DRAW GAME!", 0, 0, 84, "#ffeb3b", "#000", undefined, 10);
    c.restore();
    if(w){ faceIcon(c, w.i, W/2, 300, 52); txt(c, w.hp>=100?"FLAWLESS VICTORY!":"FLAWLESS? NOT EXACTLY.",W/2,370,18,"#ddd"); }
    if(t>40){
      [["REMATCH",250],["MENU",490]].forEach(([s,x],i)=>{ c.fillStyle=i?"rgba(0,0,0,.7)":"#ffd23f"; c.strokeStyle="#fff"; c.lineWidth=3;
        c.fillRect(x,392,220,56); c.strokeRect(x,392,220,56); txt(c,s,x+110,421,30,i?"#fff":"#b0101a",i?"#000":"#fff"); });
      txt(c,"tap a button  ·  keyboard: ENTER rematch, ESC menu",W/2,480,18,"#ddd");
    }
  }
}

// ===================== LOOP =====================
let last = performance.now(), acc = 0, loopN = 0;
function loop(now){
  acc += Math.min(100, now-last); last = now;
  while(acc >= 1000/60){ update(); acc -= 1000/60; }
  render();
  if((++loopN % 15)===0) checkViewport();
  if(loopN % 6===0 && game.scene==="game") touchBtns.forEach(bt=>{ const f = game.fighters[game.human]; if(!f) return;
    if(bt.k==="special") bt.el.classList.toggle("cool", f.cdSpecial>0); if(bt.k==="super") bt.el.classList.toggle("cool", f.cdSuper>0); });   // catches address-bar show/hide or rotations that fire no event
  requestAnimationFrame(loop);
}
window.__game = game; window.__errors = [];
loadFaces(()=>{
  if(DEMO){
    game.startMatch();
    game.phase="fight"; game.banner=null;
    const [a,b] = game.fighters;
    if(DEMO==="damage"){ a.x=380; b.x=560; a.hp=a.dispHp=45; b.hp=b.dispHp=12; a.wins=1; game.timer=37;
      b.hitFlash=0.45; b.state="hit"; b.stun=6; game.sparks(b.x-40,b.y-130,"#fff36b",18); game.popup("WHAM!",(a.x+b.x)/2,b.y-120,null,40); }
    if(DEMO==="ko"){ b.hp=0; b.state="ko"; b.koT=30; a.state="win"; }
    if(DEMO==="fight"){ a.x=360; b.x=600; }
  }
  requestAnimationFrame(loop);
});
</script>
<div id="pwlock">
<div class="pwl"><div id="pwtitle">FACE FIGHTER</div>
<div style="font-size:20px;color:#fff;margin-bottom:10px;font-family:Arial,sans-serif">Enter password</div>
<input id="pwin" type="password" inputmode="numeric" pattern="[0-9]*" autocomplete="off" readonly maxlength="8" aria-label="password">
<div id="pwerr"></div></div>
<div id="pwpad"><button data-d="1">1</button><button data-d="2">2</button><button data-d="3">3</button><button data-d="4">4</button><button data-d="5">5</button><button data-d="6">6</button><button data-d="7">7</button><button data-d="8">8</button><button data-d="9">9</button><button data-d="C" style="font-size:calc(var(--k)*.28)">CLEAR</button><button data-d="0">0</button><button data-d="OK" class="ok" style="font-size:calc(var(--k)*.32)">OK</button></div>
</div>
<script>(function(){var L=document.getElementById('pwlock'),I=document.getElementById('pwin'),E=document.getElementById('pwerr');
function go(){ if(!L) return; if(I.value==='6969'){['keydown','keyup'].forEach(function(t){window.removeEventListener(t,blk,true);});L.remove();L=null;try{if(window.audio)audio();}catch(e){}}
  else{E.textContent='Wrong password!';I.value='';} }
function add(d){ if(!L) return; if(d==='C'){I.value='';E.textContent='';return;} if(d==='OK'){go();return;}
  if(I.value.length<8){ I.value+=d; E.textContent=''; } if(I.value.length===4) setTimeout(go,120); }
function blk(e){ if(!L) return; e.stopImmediatePropagation(); if(e.type!=='keydown') return;
  if(/^[0-9]$/.test(e.key)) add(e.key); else if(e.key==='Backspace'){ I.value=I.value.slice(0,-1); } else if(e.key==='Enter') go(); else return; e.preventDefault(); }
['keydown','keyup'].forEach(function(t){window.addEventListener(t,blk,true);});
Array.prototype.forEach.call(document.querySelectorAll('#pwpad button'),function(b){ b.addEventListener('click',function(e){ e.preventDefault(); add(b.dataset.d); }); });
window.__pwgo = go; })();</script>
